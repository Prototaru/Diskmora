[package]
name = "diskmora"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
name = "diskmora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.6.1"

[dependencies]
tauri = "=2.11.1"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-opener = "=2.5.4"
serde = { version = "=1.0.228", features = ["derive"] }
anyhow = "=1.0.102"
walkdir = "=2.5.0"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
unrar = "=0.5.8"
